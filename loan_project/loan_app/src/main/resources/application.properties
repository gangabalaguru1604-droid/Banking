# ==========================================
# Application Configuration - Render
# ==========================================
server.port=${PORT:8081}
server.address=0.0.0.0
spring.application.name=loan_app

# Reverse Proxy and HTTPS
server.forward-headers-strategy=framework

# ==========================================
# Reverse Proxy & SSL Forwarding for Render / Cloud
# ==========================================
server.forward-headers-strategy=framework

# ==========================================
# JSP View Resolver
# ==========================================
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# ==========================================
# UTF-8 Encoding
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# ==========================================
# MongoDB Atlas / cloud MongoDB. Set SPRING_DATA_MONGODB_URI in the deployment environment.
# ==========================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=Bank-application

# ==========================================
# MongoDB stores related records as references; service code loads referenced documents as needed.
# ==========================================
spring.data.mongodb.auto-index-creation=true

# ==========================================
# Session and Cookie Security
# ==========================================
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ==========================================
# Configurable Loan Policy & Amount Slabs
# ==========================================
# Format: [name:]min-max:interestRate:tenureMonths (comma-separated)
loan.policy.min-amount=${LOAN_MIN_AMOUNT:100.0}
loan.policy.max-amount=${LOAN_MAX_AMOUNT:10000000.0}
loan.policy.slabs=${LOAN_POLICY_SLABS:Micro Starter:100-50000:12.0:12,Personal Classic:50000.01-200000:10.5:24,Prime Growth:200000.01-1000000:9.5:36,Executive Elite:1000000.01-5000000:8.5:60,Corporate Premier:5000000.01-10000000:7.5:84}

# Backward compatibility defaults
loan.product.default.interest-rate=${LOAN_DEFAULT_INTEREST_RATE:10.5}
loan.product.default.tenure-months=${LOAN_DEFAULT_TENURE_MONTHS:24}
loan.product.min-amount=${LOAN_MIN_AMOUNT:100.0}
loan.product.max-amount=${LOAN_MAX_AMOUNT:10000000.0}

# ==========================================
# Security Configuration (Render Env Vars with safe defaults)
# ==========================================
security.trusted-proxies.enabled=${TRUSTED_PROXIES_ENABLED:true}
security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:BankLoanManagementSecureKey2026!}
security.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@bank.com}
security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@Bank123!}

# ==========================================
# MFA Configuration (Staff Static Test OTP & Customer Dynamic MFA)
# ==========================================
mfa.staff.static-otp-enabled=${STAFF_STATIC_MFA_ENABLED:true}
mfa.staff.test-otp=${STAFF_TEST_OTP:876543}
mfa.customer.otp-validity-minutes=${CUSTOMER_OTP_VALIDITY_MINUTES:5}
mfa.customer.max-attempts=${CUSTOMER_MFA_MAX_ATTEMPTS:3}
mfa.customer.mail.from=${CUSTOMER_MFA_MAIL_FROM:security@bankofindia.co.in}
mfa.customer.mail.simulate=${CUSTOMER_MFA_MAIL_SIMULATE:false}

# ==========================================
# Identity Provider / SMS
# ==========================================
bank.idp.production-enabled=${BANK_IDP_PRODUCTION_ENABLED:false}
sms.provider.configured=${SMS_PROVIDER_CONFIGURED:false}
sms.provider.api-key=${SMS_PROVIDER_API_KEY:}

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO

# ==========================================
# DPD Reminder Scheduler
# ==========================================
reminder.scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:false}
reminder.scheduler.cron=${REMINDER_SCHEDULER_CRON:0 0 9 * * *}
reminder.scheduler.timezone=${REMINDER_SCHEDULER_TIMEZONE:Asia/Kolkata}
reminder.batch.size=${REMINDER_BATCH_SIZE:100}

# Penalties
reminder.penalty.dpd1=${REMINDER_PENALTY_DPD1:0.00}
reminder.penalty.dpd2=${REMINDER_PENALTY_DPD2:150.00}
reminder.penalty.dpd3=${REMINDER_PENALTY_DPD3:300.00}

reminder.helpdesk.phone=${REMINDER_HELPDESK_PHONE:1800-200-8899}
reminder.payment.base-url=${REMINDER_PAYMENT_BASE_URL:http://localhost:8081/payPage}

# Retry Configuration
reminder.retry.max-attempts=${REMINDER_RETRY_MAX_ATTEMPTS:3}
reminder.retry.delay-ms=${REMINDER_RETRY_DELAY_MS:1000}
reminder.webhook.secret=${REMINDER_WEBHOOK_SECRET:test_webhook_secret_patil_capitals_2026}

# ==========================================
# Reminder Email
# ==========================================
reminder.mail.from=${REMINDER_MAIL_FROM:}
reminder.mail.simulate=${REMINDER_MAIL_SIMULATE:false}

# ==========================================
# Transactional Email Provider (HTTPS REST API / Simulation for Render)
# Supported EMAIL_PROVIDER_TYPE: AUTO, RESEND, SENDGRID, BREVO, HTTP_REST, SMTP, SIMULATED
# ==========================================
reminder.email.provider=${EMAIL_PROVIDER_TYPE:AUTO}
reminder.email.api-key=${EMAIL_API_KEY:}
reminder.email.api-url=${EMAIL_API_URL:}
reminder.email.resend-api-key=${RESEND_API_KEY:}
reminder.email.sendgrid-api-key=${SENDGRID_API_KEY:}
reminder.email.brevo-api-key=${BREVO_API_KEY:}

# ==========================================
# Mail Provider Configuration (Gmail SMTP)
# Note: Outbound SMTP ports 25, 465, 587 are blocked on Render. Use HTTPS email provider above on Render.
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.ssl.trust=smtp.gmail.com

# ==========================================
# MFA & Secret Encryption Settings
# ==========================================
security.mfa.encryption-key=${SECURITY_MFA_ENCRYPTION_KEY:${MFA_ENCRYPTION_KEY:DefaultDevBankSecretKeyDoNotUseInProd123!}}
mfa.staff.static-otp-enabled=${STAFF_STATIC_OTP_ENABLED:true}
mfa.staff.test-otp=${STAFF_TEST_OTP:876543}
