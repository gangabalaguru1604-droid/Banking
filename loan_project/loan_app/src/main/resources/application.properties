server.port=${PORT:8081}

spring.application.name=loan_app

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Character Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# Database Configuration with Environment Variable Support (supports DB_URL, DB_USERNAME, DB_PASSWORD, DATABASE_URL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/loan_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Session Configuration: 10 minutes server-side inactivity timeout
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Predefined Loan Product Configuration (Standard Bank Policy)
loan.product.default.interest-rate=${LOAN_DEFAULT_INTEREST_RATE:10.5}
loan.product.default.tenure-months=${LOAN_DEFAULT_TENURE_MONTHS:24}
loan.product.min-amount=${LOAN_MIN_AMOUNT:100.0}
loan.product.max-amount=${LOAN_MAX_AMOUNT:10000000.0}


# Security Configuration
security.trusted-proxies.enabled=${TRUSTED_PROXIES_ENABLED:false}
security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:BankLoanManagementSecureKey2026!}
security.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@bank.com}
security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@Bank123!}

# Identity Provider & SMS Provider Configuration
bank.idp.production-enabled=${BANK_IDP_PRODUCTION_ENABLED:false}
sms.provider.configured=${SMS_PROVIDER_CONFIGURED:false}
sms.provider.api-key=${SMS_PROVIDER_API_KEY: }

# Detailed Request and Dispatcher Logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# DPD 1-3 Automated Reminder Workflow Configuration
reminder.scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:true}
reminder.scheduler.cron=${REMINDER_SCHEDULER_CRON:0 0 9 * * *}
reminder.scheduler.timezone=${REMINDER_SCHEDULER_TIMEZONE:Asia/Kolkata}
reminder.batch.size=${REMINDER_BATCH_SIZE:100}

reminder.penalty.dpd1=${REMINDER_PENALTY_DPD1:0.00}
reminder.penalty.dpd2=${REMINDER_PENALTY_DPD2:150.00}
reminder.penalty.dpd3=${REMINDER_PENALTY_DPD3:300.00}
reminder.helpdesk.phone=${REMINDER_HELPDESK_PHONE:1800-200-8899}
reminder.payment.base-url=${REMINDER_PAYMENT_BASE_URL:http://localhost:8081/payPage}

reminder.retry.max-attempts=${REMINDER_RETRY_MAX_ATTEMPTS:3}
reminder.retry.delay-ms=${REMINDER_RETRY_DELAY_MS:1000}
reminder.webhook.secret=${REMINDER_WEBHOOK_SECRET:test_webhook_secret_patil_capitals_2026}

reminder.mail.from=${REMINDER_MAIL_FROM:gangab0934@gmail.com}
reminder.mail.simulate=${REMINDER_MAIL_SIMULATE:false}

# Transactional Email Provider Configuration (HTTPS REST API / SMTP / Simulation)
# Supported EMAIL_PROVIDER_TYPE: AUTO, RESEND, SENDGRID, BREVO, HTTP_REST, SMTP, SIMULATED
reminder.email.provider=${EMAIL_PROVIDER_TYPE:AUTO}
reminder.email.api-key=${EMAIL_API_KEY:}
reminder.email.api-url=${EMAIL_API_URL:}
reminder.email.resend-api-key=${RESEND_API_KEY:}
reminder.email.sendgrid-api-key=${SENDGRID_API_KEY:}
reminder.email.brevo-api-key=${BREVO_API_KEY:}

# Mail Provider Configuration (Gmail SMTP - Note: Outbound SMTP ports 25, 465, 587 are blocked on Render)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:gangab0934@gmail.com}
spring.mail.password=${MAIL_PASSWORD:fmdjhgapuqnsuaau}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com




