# Test MongoDB. Provide MONGODB_TEST_URI or run a local MongoDB instance.
spring.data.mongodb.uri=${MONGODB_TEST_URI:mongodb://localhost:27017/loan_app_test?retryWrites=false}
spring.data.mongodb.auto-index-creation=true

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Session Configuration: 10 minutes inactivity timeout
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Loan Product Configuration for Tests
loan.policy.min-amount=100.0
loan.policy.max-amount=10000000.0
loan.policy.slabs=Micro Starter:100-50000:12.0:12,Personal Classic:50000.01-200000:10.5:24,Prime Growth:200000.01-1000000:9.5:36,Executive Elite:1000000.01-5000000:8.5:60,Corporate Premier:5000000.01-10000000:7.5:84
loan.product.default.interest-rate=10.5
loan.product.default.tenure-months=24
loan.product.min-amount=100.0
loan.product.max-amount=10000000.0


# Security Settings
security.trusted-proxies.enabled=true
security.mfa.encryption-key=TestMasterEncryptionKey32BytesLong!
security.initial-admin.email=admin@bank.com
security.initial-admin.password=Admin@Bank123!

bank.idp.production-enabled=false
sms.provider.configured=false

# MFA Configuration for Tests
mfa.staff.static-otp-enabled=true
mfa.staff.test-otp=876543
mfa.customer.otp-validity-minutes=5
