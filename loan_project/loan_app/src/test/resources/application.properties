# Test Database Configuration (H2 In-Memory with PostgreSQL Compatibility)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Session Configuration: 10 minutes inactivity timeout
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Security Settings
security.trusted-proxies.enabled=true
security.mfa.encryption-key=TestMasterEncryptionKey32BytesLong!
security.initial-admin.email=admin@bank.com
security.initial-admin.password=Admin@Bank123!

bank.idp.production-enabled=false
sms.provider.configured=false

# Reminder Configuration for Tests
reminder.scheduler.enabled=true
reminder.scheduler.timezone=Asia/Kolkata
reminder.batch.size=10
reminder.penalty.dpd1=0.00
reminder.penalty.dpd2=150.00
reminder.penalty.dpd3=300.00
reminder.helpdesk.phone=1800-200-8899
reminder.payment.base-url=http://localhost:8081/payPage
reminder.retry.max-attempts=3
reminder.retry.delay-ms=50
reminder.webhook.secret=test_webhook_secret_patil_capitals_2026
reminder.mail.from=reminders@patilcapitals.com
reminder.mail.simulate=true
