services:
  - type: web
    name: patil-capitals-loan-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 8080
      - key: SESSION_COOKIE_SECURE
        value: "false"
      - key: TRUSTED_PROXIES_ENABLED
        value: "true"
      # Set your Railway PostgreSQL connection string here or in the Render Dashboard
      - key: DATABASE_URL
        sync: false
      # Mail notifications configuration
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: REMINDER_MAIL_SIMULATE
        value: "false"
