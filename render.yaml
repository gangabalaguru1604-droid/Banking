services:
  - type: web
    name: patil-capitals-loan-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: patil-capitals-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "false"
      - key: TRUSTED_PROXIES_ENABLED
        value: "true"

databases:
  - name: patil-capitals-db
    databaseName: loan_db
    user: postgres
    plan: free
    region: oregon
